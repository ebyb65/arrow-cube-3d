name: Build Arrow Cube 3D (APK & Play Store AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Build Web Game
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK & Release AAB
        run: |
          cd android
          chmod +x ./gradlew
          # 1. Build Debug APK (for phone testing)
          ./gradlew assembleDebug
          # 2. Build Release AAB (for Google Play Console)
          ./gradlew bundleRelease

      - name: Upload Play Store AAB Bundle (Play Console Upload)
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCube3D-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Debug APK (Direct Testing)
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCube3D-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
