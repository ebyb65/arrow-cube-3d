name: Build Arrow Cube 3D (APK & Play Store AAB)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Game
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android SDK and app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 2))
          VERSION_NAME="1.0.${VERSION_CODE}"
          export VERSION_CODE VERSION_NAME

          python3 <<'PY'
          import os
          import re

          version_code = os.environ['VERSION_CODE']
          version_name = os.environ['VERSION_NAME']
          files = [
              'android/variables.gradle',
              'android/app/build.gradle',
              'android/app/src/main/AndroidManifest.xml',
          ]

          for path in files:
              if not os.path.exists(path):
                  continue

              with open(path, 'r', encoding='utf-8') as fp:
                  content = fp.read()

              content = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', content)
              content = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', content)
              content = re.sub(r'android:minSdkVersion="[^"]*"', 'android:minSdkVersion="24"', content)
              content = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', content)
              content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', content)
              content = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', content)
              content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', content)
              content = re.sub(r'android:targetSdkVersion="[^"]*"', 'android:targetSdkVersion="36"', content)
              content = re.sub(r'versionCode\s+\d+', f'versionCode {version_code}', content)
              content = re.sub(r'versionName\s+"[^"]*"', f'versionName "{version_name}"', content)

              with open(path, 'w', encoding='utf-8') as fp:
                  fp.write(content)

              print(f'Configured {path}: versionCode={version_code}, versionName={version_name}')
          PY

      - name: Build Android Debug APK and Release AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Sign Release AAB for Google Play
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/*.aab \
            "$ANDROID_KEY_ALIAS"

          jarsigner -verify android/app/build/outputs/bundle/release/*.aab
          rm -f upload-keystore.jks

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCube3D-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Play Store AAB Bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCube3D-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
