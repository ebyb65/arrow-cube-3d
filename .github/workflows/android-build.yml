name: Build Arrow Cube 3D (APK & Play Store AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: 16
      VERSION_NAME: 1.0.15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21 (required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web game (all libraries bundled for offline play)
        run: npm run build

      - name: Create Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set up Python (for icon generation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Game icon and splash (from play_store_icon_512x512.png)
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/make_icons.py play_store_icon_512x512.png android/app/src/main/res

      - name: Configure SDK levels, version and LevelPlay Unity adapter
        run: |
          python3 - << 'EOF'
          import os, re
          vc, vn = os.environ['VERSION_CODE'], os.environ['VERSION_NAME']
          for f in ['android/variables.gradle', 'android/app/build.gradle']:
              if not os.path.exists(f):
                  continue
              s = open(f).read()
              s = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', s)
              s = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
              s = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
              s = re.sub(r'versionCode\s+\d+', f'versionCode {vc}', s)
              s = re.sub(r'versionName\s+"[^"]*"', f'versionName "{vn}"', s)
              if f.endswith('app/build.gradle'):
                  if 'unityads-adapter' not in s:
                      s = s.replace('dependencies {', "dependencies {\n    implementation 'com.unity3d.ads-mediation:unityads-adapter:5.15.0'", 1)
                  # Same as Drop 2048: leave out the Ad Quality SDK (Data safety: installed apps)
                  rule = "exclude group: 'com.unity3d.ads-mediation', module: 'adquality-sdk'"
                  if rule not in s:
                      s += "\nconfigurations.all {\n    " + rule + "\n}\n"
              open(f, 'w').write(s)
              print('Configured', f)
          EOF

      - name: Build Android Debug APK & Release AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleRelease

      - name: TEMP inspect Play Age Signals API
        if: always()
        run: |
          set -x
          AAR=$(find ~/.gradle -name "age-signals-*.aar" | head -1); echo "$AAR"
          mkdir -p /tmp/as && cd /tmp/as && unzip -q -o "$AAR" classes.jar && unzip -q -o classes.jar
          find . -name "*.class" | grep -v '\$' | sed 's#^./##; s#.class$##; s#/#.#g' | sort > list.txt; cat list.txt
          for c in $(grep -E "AgeSignalsResult$|AgeSignalsVerificationStatus$|AgeSignalsErrorCode$|AgeSignalsException$|AgeSignalsRequest$" list.txt); do javap -cp classes.jar "$c"; done

      # adq-check: Google flagged the installed-apps check in Ad Quality SDK < 9.11.0
      # (Unity ticket 00942870). Fail the build if it is ever packaged again.
      - name: Verify bundle contents (Ad Quality SDK not packaged)
        run: |
          set -e
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          rm -rf aab-check && mkdir aab-check && unzip -q "$AAB" -d aab-check
          DEPS=aab-check/BUNDLE-METADATA/com.android.tools.build.libraries/dependencies.pb
          echo "== Unity/LevelPlay libraries in bundle metadata =="
          strings "$DEPS" | grep -E "unity3d|ironsource" | sort -u || true
          if strings "$DEPS" | grep -qi "adquality"; then
            echo "FAIL: adquality-sdk is still packaged"; exit 1
          fi
          if find aab-check | grep -qi adquality; then
            echo "FAIL: Ad Quality files still packaged"; exit 1
          fi
          echo "PASS: Ad Quality SDK not packaged"
          MAN=$(find android/app/build/intermediates -path "*release*" -name AndroidManifest.xml | grep -i merged | head -1)
          echo "manifest: $MAN"
          if grep -n "QUERY_ALL_PACKAGES" "$MAN"; then echo "WARNING: QUERY_ALL_PACKAGES present"; else echo "QUERY_ALL_PACKAGES: not present"; fi
          # age-api: the Play Age Signals plugin must be registered, or the game silently skips the age check
          if grep -q "com.yebee.agesignals.PlayAgeSignalsPlugin" android/app/src/main/assets/capacitor.plugins.json; then
            echo "PASS: PlayAgeSignals plugin registered"
          else
            echo "FAIL: PlayAgeSignals plugin missing from capacitor.plugins.json"; cat android/app/src/main/assets/capacitor.plugins.json; exit 1
          fi
          echo "== permissions in merged release manifest =="
          grep -o 'uses-permission[^>]*android:name="[^"]*"' "$MAN" | sort -u || true
          rm -rf aab-check

      - name: Upload Debug APK (direct testing)
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCube3D-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      # The signing key lives ONLY in GitHub Secrets (Settings > Secrets and variables > Actions):
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
      - name: Sign Release AAB for Google Play
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in the repo settings."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/*.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/*.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload Play Store AAB (signed)
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCube3D-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
