name: Build Arrow Cube 3D (APK & Play Store AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Build Web Game
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure SDK 36 and Version Code 2 for Google Play
        run: |
          python3 -c "
          import os, re
          files = ['android/variables.gradle', 'android/app/build.gradle', 'android/app/src/main/AndroidManifest.xml']
          for f in files:
              if os.path.exists(f):
                  with open(f, 'r') as fp:
                      content = fp.read()
                  content = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', content)
                  content = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', content)
                  content = re.sub(r'android:minSdkVersion=\"[^\"]*\"', 'android:minSdkVersion=\"24\"', content)
                  content = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', content)
                  content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', content)
                  content = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', content)
                  content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', content)
                  content = re.sub(r'android:targetSdkVersion=\"[^\"]*\"', 'android:targetSdkVersion=\"36\"', content)
                  content = re.sub(r'versionCode\s+\d+', 'versionCode 2', content)
                  content = re.sub(r'versionName\s+\"[^\"]*\"', 'versionName \"1.0.1\"', content)
                  with open(f, 'w') as fp:
                      fp.write(content)
                  print('Configured SDK 36 in', f)
          "

      - name: Build Android Debug APK & Release AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease
          cd ..

      - name: Restore and sign Release AAB for Google Play
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for required in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required is not configured"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > yebee-upload-keystore.jks
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore yebee-upload-keystore.jks \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            android/app/build/outputs/bundle/release/*.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/*.aab

      - name: Upload Debug APK (Direct Testing)
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCube3D-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Play Store AAB Bundle (Signed for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCube3D-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Clean up signing material
        if: always()
        run: rm -f yebee-upload-keystore.jks
